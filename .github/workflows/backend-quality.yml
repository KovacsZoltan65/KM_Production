name: Backend quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PHP_VERSION: "8.4"
  COMPOSER_NO_INTERACTION: "1"

jobs:
  static-analysis:
    name: Backend Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - &composer-cache
        name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-

      - name: Validate Composer configuration
        run: composer validate --strict

      - &composer-install
        name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run Larastan
        shell: bash
        run: |
          set +e
          output="$(vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github 2>&1)"
          status=$?
          set -e

          printf '%s\n' "$output"

          if (( status != 0 )); then
            output="${output//'%'/'%25'}"
            output="${output//$'\r'/'%0D'}"
            output="${output//$'\n'/'%0A'}"
            echo "::error title=Larastan failure::${output:0:3000}"
          fi

          exit "$status"

      - name: Check patch whitespace
        run: git diff --check

  tests-sqlite:
    name: Backend Tests / SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2

      - *composer-cache
      - *composer-install

      - name: Create test result directory
        run: mkdir -p test-results

      - name: Run cache invalidation regression tests
        run: php scripts/run-ci-backend-tests.php sqlite test-results/cache-junit.xml tests/Feature/BusinessCacheInvalidationTest.php

      - name: Run complete SQLite suite
        run: php scripts/run-ci-backend-tests.php sqlite test-results/sqlite-junit.xml

      - name: Publish minimal SQLite test diagnostics
        id: publish_sqlite
        if: always()
        run: php scripts/report-junit-failures.php test-results/sqlite-junit.xml test-results/published/sqlite-junit.xml

      - name: SQLite migration round-trip and seeder smoke
        run: composer test:backend:migrations:sqlite

      - name: Upload SQLite JUnit report
        if: always() && steps.publish_sqlite.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-sqlite-junit
          path: test-results/published/sqlite-junit.xml
          if-no-files-found: warn
          retention-days: 7

  tests-mysql:
    name: Backend Tests / MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env: &mysql-test-environment
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_PORT: "3306"
      TEST_MYSQL_DATABASE: km_production_testing
      TEST_MYSQL_USERNAME: km_testing
      TEST_MYSQL_PASSWORD: testing_only

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: km_production_testing
          MYSQL_USER: km_testing
          MYSQL_PASSWORD: testing_only
          MYSQL_ROOT_PASSWORD: root_testing_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          extensions: pdo_mysql
          tools: composer:v2

      - *composer-cache
      - *composer-install

      - name: Create test result directory
        run: mkdir -p test-results

      - name: Verify MySQL test connection
        run: bash scripts/ci-mysql-client.sh probe

      - name: Run complete MySQL suite
        run: php scripts/run-ci-backend-tests.php mysql test-results/mysql-junit.xml

      - name: Publish minimal MySQL test diagnostics
        id: publish_mysql
        if: always()
        run: php scripts/report-junit-failures.php test-results/mysql-junit.xml test-results/published/mysql-junit.xml

      - name: Record MySQL test settings
        if: always()
        run: bash scripts/ci-mysql-client.sh settings > test-results/mysql-settings.txt

      - name: Upload MySQL reports
        if: always() && steps.publish_mysql.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-mysql-results
          path: |
            test-results/published/mysql-junit.xml
            test-results/mysql-settings.txt
          if-no-files-found: warn
          retention-days: 7

  migrations-mysql:
    name: Database Migrations / MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: *mysql-test-environment

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: km_production_testing
          MYSQL_USER: km_testing
          MYSQL_PASSWORD: testing_only
          MYSQL_ROOT_PASSWORD: root_testing_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          extensions: pdo_mysql
          tools: composer:v2

      - *composer-cache
      - *composer-install

      - name: Verify MySQL test connection
        run: bash scripts/ci-mysql-client.sh probe

      - name: MySQL migration round-trip and seeder smoke
        run: composer test:backend:migrations:mysql
